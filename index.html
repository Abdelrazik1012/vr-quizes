        { text: "Which future trend focuses on making headsets lighter and more comfortable at lower price points?", options: ["AI Integration", "Enterprise Adoption", "Affordable Hardware", "Cloud VR"], correct: "c" },
        { text: "What percentage of Americans cite 'cost' as a reason for not purchasing a VR headset?", options: ["30%", "61%", "65%", "48%"], correct: "c" },
        { text: "Which ethical concern involves the risk of virtual harassment and over-reliance on fantasy?", options: ["Psychological Impact", "Social Concerns", "Bias & Exclusion", "Privacy Issues"], correct: "b" },
        { text: "Future hardware advancements in VR focus on which of the following?", options: ["Decreased visual fidelity", "Lighter ergonomics & higher resolution", "Removing audio", "Wired-only devices"], correct: "b" },

        { text: "Unity is mentioned as a developer tool that still has:", options: ["No limitations", "Drawbacks in its game engine", "Only 2D capabilities", "No VR support"], correct: "b" },
        { text: "Which of the following is an 'Emerging Use Case' for VR?", options: ["Virtual offices and AI integration", "Offline-only calculators", "Standard 2D video editing", "Fax machine simulations"], correct: "a" },
        { text: "Which of the following is NOT a core concept of Virtual Reality?", options: ["Immersion", "Presence", "Telepresence", "Augmentation"], correct: "d" },

    // Validate: we have exactly 86 questions
    console.log("Total questions loaded:", QUESTIONS_DATA.length);

    let userAnswers = new Array(86).fill(null);
    let quizSubmitted = false;

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        QUESTIONS_DATA.forEach((q, idx) => {
            const qNumber = idx + 1;
            const card = document.createElement('div');
            card.className = 'question-card';
            card.setAttribute('data-qid', idx);
            const questionText = document.createElement('div');
            questionText.className = 'question-text';
            questionText.innerHTML = `<span style="background:#2d3a5e; padding:2px 12px; border-radius:40px; margin-right:12px;">${qNumber}</span> ${q.text}`;
            card.appendChild(questionText);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';
            const letters = ['a', 'b', 'c', 'd'];
            q.options.forEach((opt, optIdx) => {
                const letter = letters[optIdx];
                const optionWrapper = document.createElement('label');
                optionWrapper.className = 'option';
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `q${idx}`;
                radio.value = letter;
                if (userAnswers[idx] === letter) radio.checked = true;
                radio.addEventListener('change', (e) => {
                    if (!quizSubmitted) {
                        userAnswers[idx] = e.target.value;
                        updateStats();
                    } else {
                        // If quiz submitted, prevent changes or optionally re-enable? better to block changes after grading
                        e.target.checked = false;
                        alert("Quiz already submitted. Press 'Reset Answers' to try again.");
                    }
                });
                const spanLabel = document.createElement('span');
                spanLabel.className = 'option-label';
                spanLabel.innerHTML = `<strong>${letter.toUpperCase()})</strong> ${opt}`;
                optionWrapper.appendChild(radio);
                optionWrapper.appendChild(spanLabel);
                optionsDiv.appendChild(optionWrapper);
            });
            card.appendChild(optionsDiv);
            if (quizSubmitted && userAnswers[idx]) {
                const isCorrect = (userAnswers[idx] === q.correct);
                if (isCorrect) card.classList.add('correct-highlight');
                else card.classList.add('incorrect-highlight');
                const feedbackSpan = document.createElement('div');
                feedbackSpan.style.fontSize = '0.8rem';
                feedbackSpan.style.marginTop = '0.6rem';
                feedbackSpan.style.fontWeight = '500';
                if (isCorrect) {
                    feedbackSpan.innerHTML = '✅ Correct';
                    feedbackSpan.style.color = '#86efac';
                } else {
                    feedbackSpan.innerHTML = `❌ Incorrect. Correct answer: ${q.correct.toUpperCase()}) ${q.options[letters.indexOf(q.correct)]}`;
                    feedbackSpan.style.color = '#fbbf24';
                }
                card.appendChild(feedbackSpan);
            }
            container.appendChild(card);
        });
    }

    function updateStats() {
        const answered = userAnswers.filter(a => a !== null).length;
        document.getElementById('totalCounter').innerText = answered;
        if (!quizSubmitted) {
            document.getElementById('scoreDisplay').innerText = '?';
        } else {
            let correctCount = 0;
            for (let i = 0; i < QUESTIONS_DATA.length; i++) {
                if (userAnswers[i] && userAnswers[i] === QUESTIONS_DATA[i].correct) correctCount++;
            }
            document.getElementById('scoreDisplay').innerText = `${correctCount}`;
        }
    }

    function computeScoreAndShow() {
        if (quizSubmitted) {
            alert("Quiz already graded! Press 'Reset Answers' to take the quiz again.");
            return;
        }
        let answeredCount = userAnswers.filter(a => a !== null).length;
        if (answeredCount < 86) {
            if (!confirm(`You have answered ${answeredCount} out of 86 questions. Submit anyway? Unanswered will count as wrong.`)) {
                return;
            }
        }
        let correctTotal = 0;
        for (let i = 0; i < QUESTIONS_DATA.length; i++) {
            if (userAnswers[i] && userAnswers[i] === QUESTIONS_DATA[i].correct) correctTotal++;
        }
        quizSubmitted = true;
        document.getElementById('scoreDisplay').innerText = `${correctTotal}`;
        const percent = ((correctTotal / 86) * 100).toFixed(1);
        const msgDiv = document.getElementById('resultMessage');
        msgDiv.style.display = 'block';
        msgDiv.innerHTML = `<strong>🏆 Final Score: ${correctTotal} / 86 (${percent}%)</strong><br> 
        ${percent >= 70 ? '🌟 Excellent VR knowledge! 🌟' : percent >= 50 ? '📚 Good attempt, review the topics for mastery.' : '🎓 Keep studying — virtual reality concepts take practice!'}
        <br> <span style="font-size:0.85rem;">✅ Green cards = correct &nbsp;&nbsp; 🟠 Orange cards = incorrect (correct answer shown)</span>`;
        renderQuestions();  // re-render with highlight & correct answers
        updateStats();
    }

    function resetQuiz() {
        userAnswers = new Array(86).fill(null);
        quizSubmitted = false;
        document.getElementById('resultMessage').style.display = 'none';
        document.getElementById('scoreDisplay').innerText = '0';
        document.getElementById('totalCounter').innerText = '0';
        renderQuestions();
        updateStats();
    }

    // initial render
    renderQuestions();
    updateStats();

    document.getElementById('submitQuiz').addEventListener('click', computeScoreAndShow);
    document.getElementById('resetQuiz').addEventListener('click', resetQuiz);
</script>
</body>
</html>
