    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0f0';
        ctx.font = `bold ${fontSize}px monospace`;

            const text = chars[Math.floor(Math.random() * chars.length)];

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 45);
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;

        { text: "The feeling of being physically present and engaged within the virtual environment is called _______.", options: ["Presence", "Immersion", "Interaction", "Telepresence"], correct: "a" },
        { text: "The mismatch between visual motion cues and vestibular cues that causes discomfort in VR is known as ______.", options: ["Simulation sickness", "VR sickness (cybersickness)", "Motion parallax", "Vergence-accommodation conflict"], correct: "b" },
        { text: "VR applications in healthcare that use virtual environments to treat phobias or PTSD are called ______ therapy.", options: ["Drug", "Physical", "Exposure", "Cognitive"], correct: "c" },
        { text: "The technology that provides tactile feedback in VR systems is called ______.", options: ["Haptics", "Force feedback", "Ultrasonic feedback", "Tactile rendering"], correct: "a" },
        { text: "The future trend in VR that involves using remote servers to process VR experiences and stream them to headsets is called ______ VR.", options: ["Standalone", "Tethered", "Cloud", "Edge"], correct: "c" }
    ];

    const TRUE_FALSE = [
        { text: "Decreasing draw calls is a recommended performance tip for VR development.", options: ["True", "False"], correct: "a" },
        { text: "Effective optimization can improve performance from 5 FPS to 90 FPS.", options: ["True", "False"], correct: "a" },
        { text: "Advanced eye tracking will likely decrease the accuracy of foveated rendering in the future.", options: ["True", "False"], correct: "b" },
        { text: "30 FPS is the minimum requirement for a comfortable VR experience.", options: ["True", "False"], correct: "b" },
        { text: "Motion-to-photon delay is irrelevant to a user's VR experience.", options: ["True", "False"], correct: "b" },
        { text: "SLAM algorithms are used to estimate the position of a headset in its environment.", options: ["True", "False"], correct: "a" },
        { text: "The Quest 2 cannot be connected to a PC.", options: ["True", "False"], correct: "b" },
        { text: "Adjustable IPD helps ensure a clearer image for the user.", options: ["True", "False"], correct: "a" },
        { text: "Gloves and haptic systems are considered VR input devices.", options: ["True", "False"], correct: "a" },
        { text: "An SDK is a development tool used for creating VR applications.", options: ["True", "False"], correct: "a" },
        { text: "Interaction Design (IxD) focuses on the holistic relationship between the user and the product, including non-interactive aspects.", options: ["True", "False"], correct: "b" },
        { text: "Don Norman's principle of 'Feedback' involves letting the user know what action has been taken and what has been accomplished.", options: ["True", "False"], correct: "a" },
        { text: "A 'hamburger menu' is an example of high visibility compared to a tab-bar menu.", options: ["True", "False"], correct: "b" },
        { text: "Consistency in design helps build user confidence by creating predictability.", options: ["True", "False"], correct: "a" },
        { text: "UX Design is considered a subset of Interaction Design.", options: ["True", "False"], correct: "b" },
        { text: "'Affordance' refers to the attributes of an object that allow people to know how to use it.", options: ["True", "False"], correct: "a" },
        { text: "VR Development only involves coding for user interaction and does not include 3D environment design.", options: ["True", "False"], correct: "b" },
        { text: "The Discovery Phase is where you identify target behaviors and set learning objectives.", options: ["True", "False"], correct: "a" },
        { text: "OpenVR and Oculus SDK are examples of Software Development Kits (SDKs).", options: ["True", "False"], correct: "a" },
        { text: "Performance testing on a desktop emulator is sufficient to reveal mobile-specific bottlenecks.", options: ["True", "False"], correct: "b" },
        { text: "The 'Technical Review' in the platform submission process verifies if the app meets minimum technical standards.", options: ["True", "False"], correct: "a" },
        { text: "The Global VR Market is expected to reach $22 Billion by the year 2025.", options: ["True", "False"], correct: "a" },
        { text: "VR Exposure Therapy is an ineffective method for treating PTSD and anxiety disorders.", options: ["True", "False"], correct: "b" },
        { text: "Medical training using VR can result in a 63% increase in knowledge retention.", options: ["True", "False"], correct: "a" },
        { text: "VR in the automotive industry actually increases the need for physical prototypes.", options: ["True", "False"], correct: "b" },
        { text: "According to the notes, VR training programs have a user engagement rate of 84%.", options: ["True", "False"], correct: "a" },
        { text: "VR systems can track unique user movements, which raises significant privacy and data ownership concerns.", options: ["True", "False"], correct: "a" },
        { text: "There is currently no risk of psychological impact, such as emotional manipulation, when using VR.", options: ["True", "False"], correct: "b" },
        { text: "Approximately 61% of Americans have expressed a strong interest in owning a VR headset.", options: ["True", "False"], correct: "b" },
        { text: "High cost is a barrier for developers, with app development costs ranging from $30K to $150K.", options: ["True", "False"], correct: "a" },
        { text: "'Latency Issues' refer to the delay between signals that can negatively affect the user experience.", options: ["True", "False"], correct: "a" },
        { text: "VR technology is currently evolving beyond gaming into enterprise applications across various industries.", options: ["True", "False"], correct: "a" }
    ];

    const ALL_QUESTIONS = [...MCQS, ...TRUE_FALSE];
    const TOTAL_QS = ALL_QUESTIONS.length;
    let userAnswers = new Array(TOTAL_QS).fill(null);
    let quizSubmitted = false;

    function getOptionLetters(q) {
        return ['a', 'b', 'c', 'd'].slice(0, q.options.length);
    }

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        ALL_QUESTIONS.forEach((q, idx) => {
            const qNumber = idx + 1;
            const card = document.createElement('div');
            card.className = 'question-card';
            const questionText = document.createElement('div');
            questionText.className = 'question-text';
            let typeBadge = (idx >= MCQS.length) ? '<span class="badge-tf">[T/F]</span>' : '';
            questionText.innerHTML = `<span style="background:#1a3a1a; padding:2px 10px; border-radius:30px; margin-right:12px;">${qNumber}</span> ${q.text} ${typeBadge}`;
            card.appendChild(questionText);
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';
            const letters = getOptionLetters(q);
            q.options.forEach((opt, optIdx) => {
                const letter = letters[optIdx];
                const optionWrapper = document.createElement('label');
                optionWrapper.className = 'option';
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `q${idx}`;
                radio.value = letter;
                if (userAnswers[idx] === letter) radio.checked = true;
                radio.addEventListener('change', (e) => {
                    if (!quizSubmitted) {
                        userAnswers[idx] = e.target.value;
                        updateStats();
                    } else {
                        e.target.checked = false;
                        alert(">_ SYSTEM LOCKED: Reset matrix to re-engage.");
                    }
                });
                const spanLabel = document.createElement('span');
                spanLabel.className = 'option-label';
                spanLabel.innerHTML = `<strong>${letter.toUpperCase()})</strong> ${opt}`;
                optionWrapper.appendChild(radio);
                optionWrapper.appendChild(spanLabel);
                optionsDiv.appendChild(optionWrapper);
            });
            card.appendChild(optionsDiv);
            if (quizSubmitted) {
                const userChoice = userAnswers[idx];
                const isCorrect = (userChoice && userChoice === q.correct);
                if (isCorrect) card.classList.add('correct-highlight');
                else card.classList.add('incorrect-highlight');
                const feedbackSpan = document.createElement('div');
                feedbackSpan.style.fontSize = '0.75rem';
                feedbackSpan.style.marginTop = '0.5rem';
                if (isCorrect) {
                    feedbackSpan.innerHTML = '✓ ACCESS GRANTED';
                    feedbackSpan.style.color = '#aaffaa';
                } else {
                    let correctAnswerText = q.options[letters.indexOf(q.correct)];
                    let userAnswerText = userChoice ? q.options[letters.indexOf(userChoice)] : '∅ VOID';
                    feedbackSpan.innerHTML = `✗ FAIL | input: ${userAnswerText} | required: ${correctAnswerText}`;
                    feedbackSpan.style.color = '#ffbb99';
                }
                card.appendChild(feedbackSpan);
            }
            container.appendChild(card);
        });
    }

    function updateStats() {
        const answered = userAnswers.filter(a => a !== null).length;
        document.getElementById('totalCounter').innerText = answered;
        if (!quizSubmitted) {
            document.getElementById('scoreDisplay').innerText = '?';
        } else {
            document.getElementById('scoreDisplay').innerText = computeCorrectCount();
        }
    }

    function computeCorrectCount() {
        let correct = 0;
        for (let i=0; i<TOTAL_QS; i++) {
            if (userAnswers[i] && userAnswers[i] === ALL_QUESTIONS[i].correct) correct++;
        }
        return correct;
    }

    function buildMistakeReport() {
        const mistakes = [];
        for (let i=0; i<TOTAL_QS; i++) {
            const userChoice = userAnswers[i];
            const isCorrect = (userChoice && userChoice === ALL_QUESTIONS[i].correct);
            if (!isCorrect) {
                const letters = getOptionLetters(ALL_QUESTIONS[i]);
                const correctAns = ALL_QUESTIONS[i].options[letters.indexOf(ALL_QUESTIONS[i].correct)];
                const userAnsText = userChoice ? ALL_QUESTIONS[i].options[letters.indexOf(userChoice)] : "⛔ NOT ANSWERED";
                mistakes.push({
                    num: i+1,
                    text: ALL_QUESTIONS[i].text.length > 85 ? ALL_QUESTIONS[i].text.substring(0,82)+'...' : ALL_QUESTIONS[i].text,
                    userAnswer: userAnsText,
                    correctAnswer: correctAns
                });
            }
        }
        return mistakes;
    }

    function computeScoreAndShow() {
        if (quizSubmitted) {
            alert(">_ ATTACK ALREADY EXECUTED. Use RESET MATRIX.");
            return;
        }
        const answeredCount = userAnswers.filter(a => a !== null).length;
        if (answeredCount < TOTAL_QS) {
            if (!confirm(`⚠️ Only ${answeredCount}/${TOTAL_QS} answers detected. Execute anyway? (unanswered = wrong)`)) {
                return;
            }
        }
        const correctTotal = computeCorrectCount();
        quizSubmitted = true;
        const percent = ((correctTotal / TOTAL_QS) * 100).toFixed(1);
        const mistakes = buildMistakeReport();
        const isHighScore = percent >= 70;
        attackFlash(isHighScore);
        document.getElementById('scoreDisplay').innerText = correctTotal;
        const msgDiv = document.getElementById('resultMessage');
        msgDiv.style.display = 'block';
        let mistakeHtml = '';
        if (mistakes.length === 0) {
            mistakeHtml = '<div style="color:#88ff88; margin-top:1rem;">🔥 PERFECT EXPLOIT — NO FAILED LOGS 🔥</div>';
        } else {
            mistakeHtml = `<div class="mistake-list"><h3>▶ BREACH LOGS (${mistakes.length})</h3>`;
            mistakes.forEach(m => {
                mistakeHtml += `<div class="mistake-item"><strong>Q${m.num}:</strong> ${m.text}<br> ↳ YOUR PAYLOAD: ${m.userAnswer} &nbsp;|&nbsp; <span style="color:#7eff7e;">REQUIRED: ${m.correctAnswer}</span></div>`;
            });
            mistakeHtml += '</div>';
        }
        const hackMessage = percent >= 90 ? "💀 SYSTEM FULLY COMPROMISED 💀" :
                            percent >= 70 ? "⚡ ACCESS GRANTED — ELITE HACKER ⚡" :
                            percent >= 50 ? "📡 PARTIAL BREACH — IMPROVE SKILLS" :
                            "❌ ACCESS DENIED — STUDY REQUIRED";
        msgDiv.innerHTML = `<strong>⛁ FINAL SCORE: ${correctTotal} / ${TOTAL_QS} (${percent}%)</strong><br> 
        <span style="color:#ffffaa;">${hackMessage}</span>
        ${mistakeHtml}`;
        renderQuestions();
        updateStats();
    }

    function resetQuiz() {
        userAnswers = new Array(TOTAL_QS).fill(null);
        quizSubmitted = false;
        document.getElementById('resultMessage').style.display = 'none';
        document.getElementById('scoreDisplay').innerText = '0';
        document.getElementById('totalCounter').innerText = '0';
        renderQuestions();
        updateStats();
    }

    renderQuestions();
    updateStats();
    document.getElementById('submitQuizEnd').addEventListener('click', computeScoreAndShow);
    document.getElementById('resetQuiz').addEventListener('click', resetQuiz);
</script>
</body>
</html>
